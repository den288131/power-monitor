name: Power monitor

# Один запуск проверяет статус раз в минуту ~5 ч 45 мин. Cron каждые 15 мин держит следующий
# запуск в очереди (concurrency), и он стартует сразу после окончания текущего — без пауз.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Только тест: прислать текущий статус в Telegram (без цикла)"
        type: boolean
        default: true

concurrency:
  group: power-monitor-${{ inputs.test && 'test' || 'loop' }}
  cancel-in-progress: false

permissions:
  contents: write   # только для keepalive-коммита раз в ~50 дней

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 355   # лимит GitHub — 360
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -q -r requirements.txt

      - name: Restore state
        uses: actions/cache/restore@v5
        with:
          path: state.json
          key: power-state-${{ github.run_id }}
          restore-keys: power-state-

      - name: Check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          XIAOMI_USERNAME: ${{ secrets.XIAOMI_USERNAME }}
          XIAOMI_PASSWORD: ${{ secrets.XIAOMI_PASSWORD }}
          XIAOMI_USER_ID: ${{ secrets.XIAOMI_USER_ID }}
          XIAOMI_SSECURITY: ${{ secrets.XIAOMI_SSECURITY }}
          XIAOMI_SERVICE_TOKEN: ${{ secrets.XIAOMI_SERVICE_TOKEN }}
          XIAOMI_REGION: ${{ secrets.XIAOMI_REGION }}
          XIAOMI_DEVICE_ID: ${{ secrets.XIAOMI_DEVICE_ID }}
          OFFLINE_THRESHOLD_MIN: ${{ vars.OFFLINE_THRESHOLD_MIN }}
          TIMEZONE: ${{ vars.TIMEZONE }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
          PYTHONUNBUFFERED: "1"
        run: python monitor.py check ${{ inputs.test && '--test' || '--loop-minutes 345 --interval 60' }}

      - name: Save state
        if: always() && !inputs.test && hashFiles('state.json') != ''
        uses: actions/cache/save@v5
        with:
          path: state.json
          key: power-state-${{ github.run_id }}-${{ github.run_attempt }}

      # GitHub отключает cron в публичных репо после 60 дней без коммитов
      - name: Keepalive
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 50 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keepalive"
            git push
          fi
