name: Watchdog

# Раз в ~30 мин проверяет, что workflow "Power monitor" включён и запускается; иначе пишет в Telegram.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

concurrency:
  group: watchdog
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Restore state
        uses: actions/cache/restore@v5
        with:
          path: watchdog.json
          key: watchdog-${{ github.run_id }}
          restore-keys: watchdog-

      - name: Check monitor
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 watchdog.py

      - name: Save state
        if: always() && hashFiles('watchdog.json') != ''
        uses: actions/cache/save@v5
        with:
          path: watchdog.json
          key: watchdog-${{ github.run_id }}-${{ github.run_attempt }}
